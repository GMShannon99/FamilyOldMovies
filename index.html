<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G.E. Shannon Old Family Movies</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1 id="site-title">G.E.Shannon Old Family Movies</h1>
    </header>

    <main id="stage">
      <div class="movie-grid" id="movie-grid"></div>
    </main>
  </div>

  <div id="video-overlay" class="video-overlay" aria-hidden="true">
    <video id="video-player" class="video-player" playsinline></video>
    <iframe
      id="youtube-player"
      class="youtube-player"
      title="Movie"
      frameborder="0"
      allow="autoplay; encrypted-media; picture-in-picture; web-share"
      allowfullscreen
    ></iframe>
    <button type="button" id="overlay-close-btn" class="overlay-close-btn" aria-label="Close video">&#10005;</button>
  </div>

  <script src="movies.js"></script>
  <script src="script.js"></script>
</body>
</html>
